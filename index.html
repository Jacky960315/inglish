<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Pronunciation Quiz</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1', // Indigo
                            600: '#4f46e5',
                            700: '#4338ca',
                            violet: '#8b5cf6', // Violet
                            rose: '#f43f5e',   // Rose
                        }
                    },
                    animation: {
                        'ripple': 'ripple 1.5s cubic-bezier(0, 0.2, 0.8, 1) infinite',
                    },
                    keyframes: {
                        ripple: {
                            '0%': { transform: 'scale(0.8)', opacity: '1' },
                            '100%': { transform: 'scale(2.4)', opacity: '0' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, hsla(225,39%,30%,0) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(339,49%,30%,0) 0, transparent 50%);
        }
        /* 自訂細緻滾動條 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 40px -10px rgba(99, 102, 241, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50/30 to-violet-50/40 min-h-screen text-slate-800 antialiased selection:bg-brand-violet selection:text-white pb-12">

    <!-- 頂部統計丸子列 -->
    <header class="max-w-6xl mx-auto pt-8 px-6 flex flex-wrap justify-center gap-4 z-10 relative">
        <div class="glass-card rounded-full px-6 py-2.5 flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center text-sm">
                <i class="fas fa-tasks"></i>
            </div>
            <div>
                <p class="text-xs text-slate-400 font-medium uppercase tracking-wide">進度 Progress</p>
                <p class="text-lg font-bold text-slate-700 leading-none mt-0.5"><span id="stat-progress">1</span> <span class="text-slate-400 text-sm font-medium">/ 10</span></p>
            </div>
        </div>
        
        <div class="glass-card rounded-full px-6 py-2.5 flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-sm">
                <i class="fas fa-check"></i>
            </div>
            <div>
                <p class="text-xs text-slate-400 font-medium uppercase tracking-wide">得分 Score</p>
                <p class="text-lg font-bold text-slate-700 leading-none mt-0.5" id="stat-score">0</p>
            </div>
        </div>

        <div class="glass-card rounded-full px-6 py-2.5 flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-brand-violet/10 text-brand-violet flex items-center justify-center text-sm">
                <i class="fas fa-crosshairs"></i>
            </div>
            <div>
                <p class="text-xs text-slate-400 font-medium uppercase tracking-wide">正確率 Accuracy</p>
                <p class="text-lg font-bold text-slate-700 leading-none mt-0.5" id="stat-accuracy">0%</p>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-6xl mx-auto px-6 mt-10 grid grid-cols-1 lg:grid-cols-12 gap-10">
        
        <!-- 左/中區：閃卡與互動區 -->
        <section class="lg:col-span-8 flex flex-col gap-6">
            <!-- 閃卡 -->
            <div class="glass-card rounded-[2.5rem] p-10 lg:p-14 relative overflow-hidden group">
                <!-- 裝飾性背景圓形 -->
                <div class="absolute -top-20 -right-20 w-64 h-64 bg-brand-violet/5 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-20 -left-20 w-64 h-64 bg-brand-rose/5 rounded-full blur-3xl pointer-events-none"></div>
                
                <div class="text-center relative z-10">
                    <span id="word-category" class="inline-block px-4 py-1.5 rounded-full bg-white/80 shadow-sm text-brand-violet text-sm font-semibold mb-6 tracking-wide border border-white">
                        Category
                    </span>
                    
                    <h2 id="current-word" class="text-6xl lg:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-brand-700 to-brand-violet tracking-tight mb-4 drop-shadow-sm">
                        Word
                    </h2>
                    
                    <div class="flex flex-wrap items-center justify-center gap-4 text-lg mb-10">
                        <span id="current-ipa" class="font-mono text-brand-500 bg-brand-50/50 px-3 py-1 rounded-lg border border-brand-100/50 shadow-inner">/ipa/</span>
                        <span class="text-slate-300">|</span>
                        <span id="current-translation" class="font-medium text-slate-600">翻譯</span>
                    </div>

                    <div class="bg-white/40 rounded-2xl p-6 border border-white shadow-sm inline-block max-w-2xl w-full">
                        <p id="current-example" class="text-slate-600 text-lg lg:text-xl italic font-light leading-relaxed">
                            "Example sentence goes here."
                        </p>
                    </div>
                </div>

                <!-- 操作按鈕 -->
                <div class="mt-12 flex flex-col sm:flex-row justify-center gap-5">
                    <button onclick="playTTS()" class="group/btn relative px-8 py-4 bg-white hover:bg-brand-50 text-brand-600 rounded-2xl font-bold text-lg shadow-lg shadow-brand-200/40 border border-white transition-all hover:-translate-y-1 active:translate-y-0 flex items-center justify-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-brand-100 group-hover/btn:bg-brand-200 flex items-center justify-center transition-colors">
                            <i class="fas fa-volume-up"></i>
                        </div>
                        播放發音 (TTS)
                    </button>
                    
                    <div class="relative flex justify-center items-center">
                        <!-- 錄音時的漣漪動畫層 -->
                        <div id="recording-ripple" class="absolute inset-0 rounded-2xl bg-brand-rose/40 hidden"></div>
                        <button id="btn-record" onclick="startRecording()" class="relative z-10 px-8 py-4 bg-gradient-to-r from-brand-600 to-brand-violet hover:from-brand-500 hover:to-brand-500 text-white rounded-2xl font-bold text-lg shadow-xl shadow-brand-500/30 transition-all hover:-translate-y-1 active:translate-y-0 flex items-center justify-center gap-3 min-w-[220px]">
                            <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm">
                                <i id="icon-record" class="fas fa-microphone"></i>
                            </div>
                            <span id="text-record">開始錄音挑戰</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 回饋與下一步區塊 -->
            <div id="feedback-panel" class="glass-card rounded-[2rem] p-8 hidden opacity-0 transition-opacity duration-500">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-6">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <div id="feedback-icon" class="w-10 h-10 rounded-full flex items-center justify-center text-lg shadow-sm">
                                <i class="fas fa-info"></i>
                            </div>
                            <h3 id="feedback-title" class="font-bold text-xl text-slate-800">辨識結果</h3>
                        </div>
                        <p class="text-slate-500 ml-13">你說了： <span id="feedback-text" class="font-medium text-slate-700 italic border-b border-slate-300">...</span></p>
                    </div>
                    <button id="btn-next" onclick="nextWord()" class="px-8 py-4 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold shadow-lg transition-all hover:scale-105 active:scale-95 flex items-center gap-2">
                        下一題 <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- 右區：時間軸詞彙列表 -->
        <aside class="lg:col-span-4 h-full max-h-[800px]">
            <div class="glass-card rounded-[2.5rem] p-8 h-full flex flex-col">
                <h3 class="font-bold text-xl text-slate-800 mb-6 flex items-center gap-3">
                    <i class="fas fa-route text-brand-violet text-opacity-80"></i> 學習路徑
                </h3>
                
                <div class="flex-1 overflow-y-auto pr-2 relative" id="timeline-container">
                    <!-- 左側時間軸線 -->
                    <div class="absolute left-[19px] top-4 bottom-4 w-0.5 bg-slate-200/60 z-0"></div>
                    <!-- 列表項目將由 JS 產生 -->
                </div>
            </div>
        </aside>

    </main>

    <script>
        // --- 題庫資料 (含狀態追蹤) ---
        // status: 'pending' (未答), 'correct' (正確), 'wrong' (錯誤)
        const quizWords = [
            { id: 1, word: 'Aesthetic', phonetic: '/esˈθet̬.ɪk/', translation: '美學的；審美的', example: "The new building has little aesthetic value.", category: 'Art & Design', status: 'pending' },
            { id: 2, word: 'Fascinating', phonetic: '/ˈfæs.ən.eɪ.tɪŋ/', translation: '極有趣的；迷人的', example: "I found the whole movie fascinating.", category: 'Adjectives', status: 'pending' },
            { id: 3, word: 'Resilience', phonetic: '/rɪˈzɪl.jəns/', translation: '韌性；恢復力', example: "The resilience of the human spirit is amazing.", category: 'Psychology', status: 'pending' },
            { id: 4, word: 'Serendipity', phonetic: '/ˌser.ənˈdɪp.ə.t̬i/', translation: '機緣巧合', example: "They found each other by pure serendipity.", category: 'Advanced', status: 'pending' },
            { id: 5, word: 'Meticulous', phonetic: '/məˈtɪk.jə.ləs/', translation: '嚴謹的；一絲不苟的', example: "Many hours of meticulous preparation have gone into writing the book.", category: 'Personality', status: 'pending' },
            { id: 6, word: 'Ubiquitous', phonetic: '/juːˈbɪk.wə.t̬əs/', translation: '無所不在的', example: "Mobile phones have become ubiquitous.", category: 'Advanced', status: 'pending' },
            { id: 7, word: 'Enthusiasm', phonetic: '/ɪnˈθuː.zi.æz.əm/', translation: '熱情；熱忱', example: "One of the good things about teaching young children is their enthusiasm.", category: 'Emotions', status: 'pending' },
            { id: 8, word: 'Vulnerable', phonetic: '/ˈvʌl.nɚ.ə.bəl/', translation: '脆弱的；易受傷的', example: "I felt very vulnerable, standing there without any clothes on.", category: 'Psychology', status: 'pending' },
            { id: 9, word: 'Authentic', phonetic: '/ɑːˈθen.t̬ɪk/', translation: '真實的；可靠的', example: "He was there and saw it, so his is the only authentic account.", category: 'Adjectives', status: 'pending' },
            { id: 10, word: 'Epiphany', phonetic: '/ɪˈpɪf.ə.ni/', translation: '頓悟', example: "She had an epiphany and realized it was time to leave her job.", category: 'Advanced', status: 'pending' }
        ];

        let currentIndex = 0;
        let stats = { correct: 0, attempted: 0 };
        
        // --- Web Speech API 設定 ---
        const synth = window.speechSynthesis;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';
        } else {
            console.warn("Browser does not support Speech Recognition API");
            alert("您的瀏覽器不支援語音辨識，請使用 Google Chrome。");
        }

        // --- 初始化與渲染 ---
        function init() {
            renderCard();
            renderTimeline();
            updateStatsUI();
        }

        function renderCard() {
            const current = quizWords[currentIndex];
            document.getElementById('word-category').textContent = current.category;
            document.getElementById('current-word').textContent = current.word;
            document.getElementById('current-ipa').textContent = current.phonetic;
            document.getElementById('current-translation').textContent = current.translation;
            document.getElementById('current-example').textContent = `"${current.example}"`;
            
            // 進度更新
            document.getElementById('stat-progress').textContent = currentIndex + 1;

            // 隱藏回饋面板
            const feedbackPanel = document.getElementById('feedback-panel');
            feedbackPanel.classList.add('hidden', 'opacity-0');
            feedbackPanel.classList.remove('flex');
            
            // 重置按鈕狀態
            const btnRecord = document.getElementById('btn-record');
            btnRecord.disabled = false;
            btnRecord.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            // 保留時間軸線
            container.innerHTML = '<div class="absolute left-[19px] top-4 bottom-4 w-0.5 bg-slate-200/60 z-0"></div>';

            quizWords.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = `relative z-10 flex items-start gap-4 mb-6 group cursor-pointer ${index === currentIndex ? 'opacity-100' : 'opacity-60 hover:opacity-100'} transition-opacity`;
                el.onclick = () => {
                    // 允許點擊跳題，但如果是未答過的題目，可作為練習導覽
                    currentIndex = index;
                    renderCard();
                    renderTimeline();
                };

                // 決定狀態點的顏色與圖示
                let dotClass = 'bg-white border-2 border-slate-300 text-transparent';
                let dotIcon = '';
                if (item.status === 'correct') {
                    dotClass = 'bg-emerald-400 border-2 border-emerald-400 text-white shadow-md shadow-emerald-200';
                    dotIcon = '<i class="fas fa-check text-[10px]"></i>';
                } else if (item.status === 'wrong') {
                    dotClass = 'bg-brand-rose border-2 border-brand-rose text-white shadow-md shadow-rose-200';
                    dotIcon = '<i class="fas fa-times text-[10px]"></i>';
                } else if (index === currentIndex) {
                    dotClass = 'bg-white border-4 border-brand-violet shadow-md shadow-brand-200';
                }

                el.innerHTML = `
                    <div class="mt-1 w-10 h-10 rounded-full flex-shrink-0 flex items-center justify-center ${dotClass} transition-all duration-300">
                        ${dotIcon}
                    </div>
                    <div class="bg-white/50 backdrop-blur-sm p-4 rounded-2xl flex-1 border ${index === currentIndex ? 'border-brand-violet/30 shadow-md' : 'border-white/40 shadow-sm'} transition-all">
                        <p class="font-bold text-slate-800 text-lg leading-tight">${item.word}</p>
                        <p class="text-slate-500 text-sm mt-1">${item.translation}</p>
                    </div>
                `;
                container.appendChild(el);
            });
            
            // 自動滾動到當前題目
            const activeItem = container.children[currentIndex + 1]; // +1 因為有 timeline 線
            if(activeItem) {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // --- 互動邏輯 ---
        function playTTS() {
            if (synth.speaking) synth.cancel();
            const text = quizWords[currentIndex].word;
            const utterThis = new SpeechSynthesisUtterance(text);
            utterThis.lang = 'en-US';
            utterThis.rate = 0.85; // 稍微放慢一點點以利聽清楚
            synth.speak(utterThis);
        }

        function startRecording() {
            if (!recognition) return;
            if (isRecording) {
                recognition.stop();
                return;
            }
            recognition.start();
        }

        if (recognition) {
            recognition.onstart = function() {
                isRecording = true;
                
                // UI: 變成錄音狀態 (玫瑰紅 + 漣漪)
                const btn = document.getElementById('btn-record');
                const ripple = document.getElementById('recording-ripple');
                const icon = document.getElementById('icon-record');
                const text = document.getElementById('text-record');

                btn.classList.replace('from-brand-600', 'from-brand-rose');
                btn.classList.replace('to-brand-violet', 'to-red-500');
                btn.classList.replace('hover:from-brand-500', 'hover:from-brand-rose');
                btn.classList.replace('hover:to-brand-500', 'hover:to-red-500');
                btn.classList.replace('shadow-brand-500/30', 'shadow-rose-500/40');
                
                ripple.classList.remove('hidden');
                ripple.classList.add('animate-ripple');
                
                icon.className = 'fas fa-stop text-brand-rose';
                text.textContent = '聆聽中...';
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                checkAnswer(transcript);
            };

            recognition.onerror = function(event) {
                console.error('Recognition Error:', event.error);
                resetRecordingUI();
                showFeedback('無法辨識，請重試', false, 'error');
            };

            recognition.onspeechend = function() {
                recognition.stop();
            };

            recognition.onend = function() {
                resetRecordingUI();
            };
        }

        function resetRecordingUI() {
            isRecording = false;
            const btn = document.getElementById('btn-record');
            const ripple = document.getElementById('recording-ripple');
            const icon = document.getElementById('icon-record');
            const text = document.getElementById('text-record');

            btn.classList.replace('from-brand-rose', 'from-brand-600');
            btn.classList.replace('to-red-500', 'to-brand-violet');
            btn.classList.replace('hover:from-brand-rose', 'hover:from-brand-500');
            btn.classList.replace('hover:to-red-500', 'hover:to-brand-500');
            btn.classList.replace('shadow-rose-500/40', 'shadow-brand-500/30');
            
            ripple.classList.add('hidden');
            ripple.classList.remove('animate-ripple');
            
            icon.className = 'fas fa-microphone text-brand-600';
            text.textContent = '開始錄音挑戰';
        }

        function checkAnswer(transcript) {
            const currentItem = quizWords[currentIndex];
            const targetWord = currentItem.word;
            
            // 轉小寫、去標點
            const cleanTarget = targetWord.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").trim();
            const cleanTranscript = transcript.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").trim();

            const isCorrect = cleanTranscript === cleanTarget || cleanTranscript.includes(cleanTarget);

            if (currentItem.status === 'pending') {
                stats.attempted++;
            }

            if (isCorrect) {
                if (currentItem.status !== 'correct') {
                    if(currentItem.status === 'pending') stats.correct++;
                    currentItem.status = 'correct';
                }
                showFeedback(transcript, true);
                // 答對給予小獎勵音效(TTS替代)
                setTimeout(() => { playTTSMessage("Perfect!"); }, 300);
            } else {
                if (currentItem.status === 'pending') {
                    currentItem.status = 'wrong';
                }
                showFeedback(transcript, false);
            }

            updateStatsUI();
            renderTimeline();
            
            // 鎖定錄音按鈕，強制作答下一題 (可選設計)
            // document.getElementById('btn-record').disabled = true;
            // document.getElementById('btn-record').classList.add('opacity-50', 'cursor-not-allowed');
        }

        function showFeedback(transcript, isCorrect, type = 'normal') {
            const panel = document.getElementById('feedback-panel');
            const iconWrap = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            const text = document.getElementById('feedback-text');
            const btnNext = document.getElementById('btn-next');

            panel.classList.remove('hidden', 'opacity-0');
            panel.classList.add('flex', 'opacity-100');

            if (type === 'error') {
                iconWrap.className = 'w-12 h-12 rounded-full flex items-center justify-center text-xl shadow-md bg-amber-100 text-amber-500';
                iconWrap.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
                title.textContent = '收音發生問題';
                title.className = 'font-bold text-xl text-amber-700';
                text.textContent = '無法取得麥克風訊號或辨識失敗。';
                text.className = 'font-medium text-amber-600';
                btnNext.classList.add('hidden'); // 錯誤時不強制下一步
                return;
            }

            btnNext.classList.remove('hidden');
            text.textContent = `"${transcript}"`;

            if (isCorrect) {
                iconWrap.className = 'w-12 h-12 rounded-full flex items-center justify-center text-xl shadow-md bg-emerald-100 text-emerald-500';
                iconWrap.innerHTML = '<i class="fas fa-check"></i>';
                title.textContent = '發音完美！ (Excellent)';
                title.className = 'font-bold text-xl text-emerald-700';
                text.className = 'font-medium text-emerald-600 italic border-b border-emerald-200';
            } else {
                iconWrap.className = 'w-12 h-12 rounded-full flex items-center justify-center text-xl shadow-md bg-rose-100 text-brand-rose';
                iconWrap.innerHTML = '<i class="fas fa-times"></i>';
                title.textContent = '有點小誤差 (Try Again)';
                title.className = 'font-bold text-xl text-rose-700';
                text.className = 'font-medium text-rose-600 italic border-b border-rose-200';
            }
        }

        function updateStatsUI() {
            document.getElementById('stat-score').textContent = stats.correct;
            const accuracy = stats.attempted === 0 ? 0 : Math.round((stats.correct / stats.attempted) * 100);
            document.getElementById('stat-accuracy').textContent = `${accuracy}%`;
        }

        function nextWord() {
            if (currentIndex < quizWords.length - 1) {
                currentIndex++;
                renderCard();
                renderTimeline();
            } else {
                // 測驗結束邏輯 (可自訂)
                alert(`測驗完成！你的總得分是：${stats.correct} / ${quizWords.length}`);
                currentIndex = 0;
                stats = { correct: 0, attempted: 0 };
                quizWords.forEach(w => w.status = 'pending');
                init();
            }
        }

        function playTTSMessage(msg) {
            const utterThis = new SpeechSynthesisUtterance(msg);
            utterThis.lang = 'en-US';
            utterThis.rate = 1.2;
            synth.speak(utterThis);
        }

        // 啟動
        window.onload = init;
    </script>
</body>
</html>
